name: Perimeter HA regression
on:
  push:
    branches: [main, feature/perimeter-ha-guardian]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video regression dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5' 'psutil>=6,<8'
      - name: Compile HA and production adapters
        run: python -m compileall -q guardian deploy RFID_reader_v4 DB_RusGard KPP RTSP web common
      - name: Parse Windows deployment scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem deploy/ha/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Failover, repair boundary, bridge, updates and existing regressions
        run: python -m unittest discover -s tests -v
